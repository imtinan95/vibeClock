<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vertical Bar Clock – Three.js</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Outfit", sans-serif;
    transition: background 0.4s ease;
  }
  body.theme-day {
    background: linear-gradient(180deg, var(--bg-top, #f5efe8) 0%, var(--bg-mid, #ebe3da) 50%, var(--bg-bot, #e8e0d8) 100%);
  }
  body.theme-night {
    background: linear-gradient(180deg, var(--bg-top, #1a1625) 0%, var(--bg-mid, #0f0d14) 50%, var(--bg-bot, #0a0810) 100%);
  }
  #canvas-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #canvas-container canvas {
    display: block;
    touch-action: none;
  }
  #clock-text-container {
    position: fixed;
    bottom: max(28px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }
  #info, #info-alt {
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: color 0.4s ease, text-shadow 0.4s ease, font-size 0.3s ease;
  }
  #info { font-size: 11px; }
  #info-alt { font-size: 10px; opacity: 0.85; }
  #info-alt.hidden { display: none !important; }
  body.theme-day #info,
  body.theme-day #info-alt {
    color: #3d3228;
    text-shadow:
      0 0 20px rgba(255, 240, 220, 0.7),
      0 0 40px rgba(255, 230, 200, 0.4),
      0 2px 4px rgba(0, 0, 0, 0.15),
      0 1px 2px rgba(255, 255, 255, 0.6);
  }
  body.theme-night #info,
  body.theme-night #info-alt {
    color: #f0e8e0;
    text-shadow:
      0 0 24px rgba(255, 240, 220, 0.5),
      0 0 48px rgba(255, 220, 180, 0.3),
      0 2px 4px rgba(0, 0, 0, 0.5);
  }
  #settings-gear {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: max(20px, env(safe-area-inset-left));
    z-index: 11;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
  }
  #settings-gear:hover { transform: rotate(90deg); }
  #settings-gear svg { width: 22px; height: 22px; }
  body.theme-day #settings-gear {
    background: rgba(255, 255, 255, 0.9);
    color: #4a3c32;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12), 0 0 20px rgba(255, 240, 220, 0.3);
  }
  body.theme-night #settings-gear {
    background: rgba(255, 255, 255, 0.12);
    color: #f0e8e0;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 220, 180, 0.15);
  }
  #settings-dropdown {
    position: fixed;
    top: max(68px, calc(20px + env(safe-area-inset-top) + 44px));
    left: max(20px, env(safe-area-inset-left));
    z-index: 12;
    min-width: 280px;
    max-width: 90vw;
    max-height: 75vh;
    overflow-y: auto;
    border-radius: 12px;
    font-family: "Outfit", sans-serif;
    font-size: 13px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    display: none;
    flex-direction: column;
    gap: 0;
  }
  #settings-dropdown.open { display: flex; }
  body.theme-day #settings-dropdown {
    background: rgba(255, 252, 248, 0.98);
    color: #3d3228;
    border: 1px solid rgba(0,0,0,0.08);
  }
  body.theme-night #settings-dropdown {
    background: rgba(30, 26, 38, 0.98);
    color: #f0e8e0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .settings-section {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  body.theme-night .settings-section { border-bottom-color: rgba(255,255,255,0.08); }
  .settings-section:last-child { border-bottom: none; }
  .settings-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .settings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-btn {
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    flex: 1;
    min-width: 70px;
  }
  body.theme-day .settings-btn {
    background: rgba(0,0,0,0.06);
    color: #4a3c32;
  }
  body.theme-day .settings-btn:hover { background: rgba(0,0,0,0.12); }
  body.theme-day .settings-btn.active {
    background: #4a3c32;
    color: #f5efe8;
  }
  body.theme-night .settings-btn {
    background: rgba(255,255,255,0.08);
    color: #f0e8e0;
  }
  body.theme-night .settings-btn:hover { background: rgba(255,255,255,0.15); }
  body.theme-night .settings-btn.active {
    background: rgba(255,240,220,0.9);
    color: #1a1625;
  }
  .color-picker-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .color-picker-row label { flex: 1; font-size: 12px; min-width: 80px; }
  .color-picker-row input[type="color"] {
    width: 36px; height: 28px;
    border: 2px solid rgba(0,0,0,0.15);
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
  }
  body.theme-night .color-picker-row input[type="color"] { border-color: rgba(255,255,255,0.2); }
  .settings-select {
    flex: 1;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 8px;
    border: 2px solid rgba(0,0,0,0.15);
    background: rgba(255,255,255,0.9);
    cursor: pointer;
  }
  body.theme-night .settings-select {
    border-color: rgba(255,255,255,0.2);
    background: rgba(40,36,50,0.9);
    color: #f0e8e0;
  }
  .settings-divider { height: 1px; background: rgba(0,0,0,0.08); margin: 8px 0; }
  body.theme-night .settings-divider { background: rgba(255,255,255,0.1); }
  .text-size-small { font-size: 9px !important; }
  .text-size-medium { font-size: 11px !important; }
  .text-size-large { font-size: 14px !important; }
  #info-alt.text-size-small { font-size: 8px !important; }
  #info-alt.text-size-medium { font-size: 10px !important; }
  #info-alt.text-size-large { font-size: 12px !important; }
  @media (max-width: 480px) {
    #settings-dropdown { min-width: 260px; }
    #info { font-size: 12px; }
    #clock-text-container { bottom: max(24px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body class="theme-day">

<div id="canvas-container"></div>
<button type="button" id="settings-gear" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>
<div id="settings-dropdown">
  <div class="settings-section">
    <div class="settings-label">Theme</div>
    <div class="settings-row">
      <button type="button" class="settings-btn theme-opt active" data-theme="day">Day</button>
      <button type="button" class="settings-btn theme-opt" data-theme="night">Night</button>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-label">Time Format</div>
    <div class="settings-row">
      <button type="button" class="settings-btn format-opt active" data-format="24">24-hour</button>
      <button type="button" class="settings-btn format-opt" data-format="12">12-hour</button>

    <div class="settings-row" style="margin-top:8px">
      <button type="button" class="settings-btn" id="reset-theme-btn" style="flex:1 1 100%">Reset Theme to Default</button>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-label">Day Theme Colors</div>
    <div class="color-picker-row">
      <label>Background top</label>
      <input type="color" id="day-bg-top" value="#f5efe8">
    </div>
    <div class="color-picker-row">
      <label>Background mid</label>
      <input type="color" id="day-bg-mid" value="#ebe3da">

    <div class="color-picker-row">
      <label>Background bottom</label>
      <input type="color" id="day-bg-bot" value="#e8e0d8">

      <label>Bar color</label>
      <input type="color" id="day-bar" value="#e0dcd6">

  </div>
  <div class="settings-section">
    <div class="settings-label">Night Theme Colors</div>
    <div class="color-picker-row">
      <label>Background top</label>
      <input type="color" id="night-bg-top" value="#1a1625">
    </div>
    <div class="color-picker-row">
      <label>Background mid</label>
      <input type="color" id="night-bg-mid" value="#0f0d14">
    </div>
    <div class="color-picker-row">
      <label>Background bottom</label>
      <input type="color" id="night-bg-bot" value="#0a0810">
    </div>

      <label>Bar color</label>
      <input type="color" id="night-bar" value="#2a2630">

  <div class="settings-section">
    <div class="settings-label">Alternate Timezone</div>
    <div class="settings-row">
      <select id="alt-timezone" class="settings-select">
        <option value="">Off</option>
        <option value="America/New_York">New York</option>
        <option value="America/Los_Angeles">Los Angeles</option>
        <option value="America/Chicago">Chicago</option>
        <option value="Europe/London">London</option>
        <option value="Europe/Paris">Paris</option>
        <option value="Asia/Tokyo">Tokyo</option>
        <option value="Asia/Shanghai">Shanghai</option>

  <div class="settings-section">
    <div class="settings-label">Text Clock Size</div>
    <div class="color-picker-row">
      <label>Main clock</label>

        <option value="small">Small</option>
        <option value="medium" selected>Medium</option>
        <option value="large">Large</option>

    <div class="color-picker-row">
      <label>Alternate clock</label>
      <select id="text-size-alt" class="settings-select">

</div>
<div id="clock-text-container">
  <p id="info">--:--:--</p>
  <p id="info-alt" class="hidden" aria-hidden="true">--:--:--</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const container = document.getElementById('canvas-container');
const timeTextEl = document.getElementById('info');

// Settings – persisted
const STORAGE_KEY = 'vibeclock-settings';
const DEFAULT_SETTINGS = {
  theme: 'day',
  format24: true,
  dayBgTop: '#f5efe8', dayBgMid: '#ebe3da', dayBgBot: '#e8e0d8', dayBar: '#e0dcd6',
  nightBgTop: '#1a1625', nightBgMid: '#0f0d14', nightBgBot: '#0a0810', nightBar: '#2a2630',
  altTimezone: '',
  textSizeMain: 'medium',
  textSizeAlt: 'small',
};
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    return { ...DEFAULT_SETTINGS, ...s };
  } catch { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
let settings = loadSettings();

// Scene – day/night backgrounds (uses settings colors)
function createBgCanvas(day) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 220, 0, 256, 256, 420);
  if (day) {
    const top = settings.dayBgTop || '#f5efe8';
    const mid = settings.dayBgMid || '#ebe3da';
    const bot = settings.dayBgBot || '#e8e0d8';
    g.addColorStop(0, top);
    g.addColorStop(0.35, mid);
    g.addColorStop(0.65, mid);
    g.addColorStop(1, bot);
  } else {
    const top = settings.nightBgTop || '#1a1625';
    const mid = settings.nightBgMid || '#0f0d14';
    const bot = settings.nightBgBot || '#0a0810';
    g.addColorStop(0, top);
    g.addColorStop(0.25, mid);
    g.addColorStop(0.5, mid);
    g.addColorStop(0.8, mid);
    g.addColorStop(1, bot);
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  return new THREE.CanvasTexture(c);
}
const scene = new THREE.Scene();
scene.background = createBgCanvas(true);
scene.fog = new THREE.FogExp2(0xe8e0d8, 0.022);

// Camera – front view (straight on)
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
camera.lookAt(0, 0, 0);

// Mobile detection for lighter shadows
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 'ontouchstart' in window;

// Renderer – enable shadows; smaller shadow map on mobile for performance
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (isMobile) renderer.domElement.style.touchAction = 'none';
container.appendChild(renderer.domElement);

// Controls – zoom/pan by default; rotate only with CTRL+Right Click
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 45;
controls.enablePan = true;
controls.panSpeed = 0.8;
controls.zoomSpeed = 1.2;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };
controls.enableRotate = false;
const PAN_LIMIT_X = 3.5;
const PAN_LIMIT_Y = 2.5;

// CTRL+Right Click to rotate – enable only when both held
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button === 2) {
    controls.enableRotate = e.ctrlKey;
    controls.mouseButtons.RIGHT = e.ctrlKey ? THREE.MOUSE.ROTATE : null;
  }
});
renderer.domElement.addEventListener('mouseup', (e) => {
  if (e.button === 2) {
    controls.enableRotate = false;
    controls.mouseButtons.RIGHT = null;
  }
});
renderer.domElement.addEventListener('mouseleave', () => {
  controls.enableRotate = false;
  controls.mouseButtons.RIGHT = null;
});

// Lights – day: soft heavenly; night: street lamp above, cozy
const ambient = new THREE.AmbientLight(0xffeedd, 0.45);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xfff5e8, 0.85);
key.position.set(0, 12, 6);
key.castShadow = true;
key.shadow.mapSize.width = isMobile ? 512 : 1024;
key.shadow.mapSize.height = isMobile ? 512 : 1024;
key.shadow.camera.near = 2;
key.shadow.camera.far = 50;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0002;
scene.add(key);
const fill = new THREE.DirectionalLight(0xc4b8ff, 0.35);
fill.position.set(-3, 4, 4);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe4c4, 0.2);
rim.position.set(2, 6, -2);
scene.add(rim);

// Digit textures: dark (strip) and light (inside circle) – reference vision.png
const darkDigitTextures = [];
const lightDigitTextures = [];
function createDigitTexture(digit, dark) {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, size, size);
  if (dark) {
    ctx.fillStyle = 'rgba(80, 70, 65, 0.9)';
  } else {
    ctx.fillStyle = 'rgba(255, 250, 245, 0.98)';
    ctx.shadowColor = 'rgba(200, 190, 180, 0.5)';
    ctx.shadowBlur = 8;
  }
  ctx.font = 'bold 90px Outfit, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(digit), size / 2, size / 2);
  ctx.shadowBlur = 0;
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}
for (let i = 0; i <= 9; i++) {
  darkDigitTextures.push(createDigitTexture(i, true));
  lightDigitTextures.push(createDigitTexture(i, false));
}

// AM/PM textures (for 12-hour mode)
function createAmPmTexture(label, dark) {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, size, size);
  if (dark) ctx.fillStyle = 'rgba(80, 70, 65, 0.9)';
  else {
    ctx.fillStyle = 'rgba(255, 250, 245, 0.98)';
    ctx.shadowColor = 'rgba(200, 190, 180, 0.5)';
    ctx.shadowBlur = 8;
  }
  ctx.font = 'bold 48px Outfit, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, size / 2, size / 2);
  ctx.shadowBlur = 0;
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}
const darkAmPmTextures = [createAmPmTexture('AM', true), createAmPmTexture('PM', true)];
const lightAmPmTextures = [createAmPmTexture('AM', false), createAmPmTexture('PM', false)];

// Block dimensions – thicker bars, one block per column, padding at bottom
const BLOCK_WIDTH = 0.52;
const BLOCK_HEIGHT = 0.85;
const BLOCK_GAP = 0.12;
const BLOCK_SPACING = BLOCK_HEIGHT + BLOCK_GAP;
const STRIP_PADDING_BOTTOM = 0.28;
const STRIP_HEIGHT = 10 * BLOCK_SPACING - BLOCK_GAP + STRIP_PADDING_BOTTOM;
const BLOCK_DEPTH = 0.32;
const BAR_WIDTH = BLOCK_WIDTH * 1.06;
const CAPSULE_RADIUS = Math.min(BAR_WIDTH, BLOCK_DEPTH) / 2;  // Max safe radius for pill shape
const COLUMN_SPACING = 1.4;
const PLANE_W = BLOCK_WIDTH * 0.88;
const PLANE_H = BLOCK_HEIGHT * 0.72;

// Capsule-like bar – RoundedBox with max corner radius for pill shape
function createCapsuleBarGeometry() {
  return new RoundedBoxGeometry(BAR_WIDTH, STRIP_HEIGHT, BLOCK_DEPTH, 6, CAPSULE_RADIUS);
}

// One block per column – recessed panel; color updated from settings
const blockMaterial = new THREE.MeshStandardMaterial({
  color: 0xe0dcd6,
  emissive: 0x3d3540,
  emissiveIntensity: 0.22,
  metalness: 0.08,
  roughness: 0.78,
});

// Create one digit column: one block (strip) that moves; circle fixed in place
function createDigitColumn(index, totalColumns, isAmPm = false) {
  const group = new THREE.Group();
  group.userData.targetStripY = 0;
  group.userData.isAmPm = isAmPm;

  const planeGeom = new THREE.PlaneGeometry(PLANE_W, PLANE_H);
  const digitTextures = isAmPm ? [darkAmPmTextures[0], darkAmPmTextures[1]] : darkDigitTextures;
  const lightTextures = isAmPm ? [lightAmPmTextures[0], lightAmPmTextures[1]] : lightDigitTextures;

  // Strip group – block + digits move together
  const stripGroup = new THREE.Group();
  stripGroup.position.y = 0;

  // Capsule-shaped bar (pill with fully rounded ends)
  const blockGeom = createCapsuleBarGeometry();
  const blockMat = blockMaterial.clone();
  const block = new THREE.Mesh(blockGeom, blockMat);
  block.position.y = STRIP_HEIGHT / 2;
  block.castShadow = true;
  block.receiveShadow = true;
  stripGroup.add(block);
  group.userData.blockMat = blockMat;

  const numDigits = isAmPm ? 2 : 10;
  const maxD = numDigits - 1;
  // Numbers stacked inside the block, 0 at top and max at bottom
  for (let d = 0; d < numDigits; d++) {
    const planeMat = new THREE.MeshBasicMaterial({
      map: digitTextures[d],
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const plane = new THREE.Mesh(planeGeom, planeMat);
    plane.position.set(0, STRIP_PADDING_BOTTOM + (maxD - d) * BLOCK_SPACING, BLOCK_DEPTH / 2 + 0.01);
    stripGroup.add(plane);
  }

  // Highlight digit (light) inside the circle – slightly scaled to suggest magnification
  const highlightMat = new THREE.MeshBasicMaterial({
    map: lightTextures[0],
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const highlightPlane = new THREE.Mesh(planeGeom, highlightMat);
  highlightPlane.position.z = BLOCK_DEPTH / 2 + 0.06;
  highlightPlane.scale.setScalar(1.18);
  stripGroup.add(highlightPlane);
  group.userData.highlightPlane = highlightPlane;
  group.userData.highlightPlaneMat = highlightMat;

  group.add(stripGroup);
  group.userData.stripGroup = stripGroup;

  // Glass circle – ring + disc with transmission for magnifying look
  const circleRadius = PLANE_W * 0.58;
  const ringGeom = new THREE.TorusGeometry(circleRadius, 0.055, 24, 48);
  const ringMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.92,
    transmission: 0.85,
    thickness: 0.12,
    roughness: 0.05,
    metalness: 0,
    ior: 1.45,
    envMapIntensity: 0.6,
  });
  const ring = new THREE.Mesh(ringGeom, ringMat);
  ring.position.set(0, 0, BLOCK_DEPTH / 2 + 0.04);
  group.add(ring);
  const glassDiscGeom = new THREE.CircleGeometry(circleRadius - 0.02, 48);
  const glassDiscMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.75,
    transmission: 0.9,
    thickness: 0.08,
    roughness: 0.04,
    metalness: 0,
    ior: 1.5,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const glassDisc = new THREE.Mesh(glassDiscGeom, glassDiscMat);
  glassDisc.position.set(0, 0, BLOCK_DEPTH / 2 + 0.035);
  group.add(glassDisc);

  const centerOffset = (totalColumns - 1) / 2;
  group.position.x = (index - centerOffset) * COLUMN_SPACING;
  group.position.y = 0;
  group.position.z = 0;

  if (isAmPm) group.scale.setScalar(0.55);  // Smaller AM/PM bar

  return group;
}

// Create colons – soft heavenly dots; x positions depend on column count
function createColons(parent, use24) {
  const geom = new THREE.SphereGeometry(0.1, 20, 20);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xfff0e0,
    transparent: true,
    opacity: 0.7,
  });
  const colonX = use24 ? [-1.4, 1.4] : [-2.1, 0.7];  // Between HH:MM and MM:SS
  colonX.forEach((x) => {
    const group = new THREE.Group();
    group.userData.isColon = true;
    group.position.x = x;
    const c1 = new THREE.Mesh(geom, mat.clone());
    c1.position.set(0, 0.25, 0);
    const c2 = new THREE.Mesh(geom, mat.clone());
    c2.position.set(0, -0.25, 0);
    group.add(c1);
    group.add(c2);
    parent.add(group);
  });
}

// Clock – front view (facing camera)
const clockGroup = new THREE.Group();
clockGroup.rotation.set(0, 0, 0);
clockGroup.scale.setScalar(0.72);
scene.add(clockGroup);

// Build clock – columns built dynamically based on format
let digitGroups = [];
let amPmColumn = null;

function buildClock() {
  digitGroups = [];
  amPmColumn = null;
  const use24 = settings.format24 !== false;
  const totalCols = use24 ? 6 : 7;

  // Remove existing digit columns and colons
  const toRemove = clockGroup.children.filter(c => 
    (c.userData && c.userData.isDigitColumn) || (c.userData && c.userData.isColon)
  );
  toRemove.forEach(c => clockGroup.remove(c));

  for (let i = 0; i < totalCols; i++) {
    const isAmPm = !use24 && i === 6;
    const col = createDigitColumn(i, totalCols, isAmPm);
    col.userData.isDigitColumn = true;
    clockGroup.add(col);
    digitGroups.push(col);
    if (isAmPm) amPmColumn = col;
  }
  createColons(clockGroup, use24);
}

// Initial build
buildClock();

let currentDigits = [0, 0, 0, 0, 0, 0];
const lerpSpeed = 0.12;

function getTimeDigits() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  const use24 = settings.format24 !== false;

  if (!use24) {
    const ampm = h >= 12 ? 1 : 0;
    h = h % 12 || 12;
    return [
      Math.floor(h / 10), h % 10,
      Math.floor(m / 10), m % 10,
      Math.floor(s / 10), s % 10,
      ampm,
    ];
  }
  return [
    Math.floor(h / 10), h % 10,
    Math.floor(m / 10), m % 10,
    Math.floor(s / 10), s % 10,
  ];
}

function getTimeDisplayString(date, use24) {
  const now = date || new Date();
  const fmt24 = use24 !== undefined ? use24 : (settings.format24 !== false);
  if (fmt24) return now.toTimeString().slice(0, 8);
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ampm}`;
}

function getTimeStringInTimezone(tz) {
  if (!tz) return '';
  try {
    const opts = { timeZone: tz, hour12: settings.format24 === false, hour: '2-digit', minute: '2-digit', second: '2-digit' };
    return new Date().toLocaleTimeString('en-US', opts);
  } catch { return '--:--:--'; }
}

function updateTime() {
  const digits = getTimeDigits();
  timeTextEl.textContent = getTimeDisplayString();

  const altTz = settings.altTimezone || '';
  const infoAlt = document.getElementById('info-alt');
  if (altTz) {
    infoAlt.classList.remove('hidden');
    infoAlt.textContent = getTimeStringInTimezone(altTz) + ' ' + altTz.split('/').pop();
  } else {
    infoAlt.classList.add('hidden');
  }

  const use24 = settings.format24 !== false;
  const maxD = use24 ? 9 : 1;  // For AM/PM column, max digit is 1

  digits.forEach((d, i) => {
    const col = digitGroups[i];
    if (!col) return;
    const colMaxD = col.userData.isAmPm ? 1 : 9;
    col.userData.targetStripY = -STRIP_PADDING_BOTTOM + (d - colMaxD) * BLOCK_SPACING;
    col.userData.highlightPlane.position.y = STRIP_PADDING_BOTTOM + (colMaxD - d) * BLOCK_SPACING;
    const texArr = col.userData.isAmPm ? lightAmPmTextures : lightDigitTextures;
    col.userData.highlightPlaneMat.map = texArr[d];
  });
  currentDigits = digits;
}

// Animation loop – move strip (lerp), clamp pan target, update controls
function animate() {
  requestAnimationFrame(animate);
  const t = lerpSpeed;
  digitGroups.forEach((group) => {
    const strip = group.userData.stripGroup;
    const target = group.userData.targetStripY;
    if (strip) strip.position.y += (target - strip.position.y) * t;
  });
  controls.target.x = Math.max(-PAN_LIMIT_X, Math.min(PAN_LIMIT_X, controls.target.x));
  controls.target.y = Math.max(-PAN_LIMIT_Y, Math.min(PAN_LIMIT_Y, controls.target.y));
  controls.update();
  renderer.render(scene, camera);
}

updateTime();
setInterval(updateTime, 1000);
animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Day / Night theme – uses settings
let isDay = true;

function applyTheme(day) {
  isDay = day;
  settings.theme = day ? 'day' : 'night';
  document.body.className = day ? 'theme-day' : 'theme-night';

  // Body gradient from settings
  const top = day ? (settings.dayBgTop || '#f5efe8') : (settings.nightBgTop || '#1a1625');
  const mid = day ? (settings.dayBgMid || '#ebe3da') : (settings.nightBgMid || '#0f0d14');
  const bot = day ? (settings.dayBgBot || '#e8e0d8') : (settings.nightBgBot || '#0a0810');
  document.body.style.setProperty('--bg-top', top);
  document.body.style.setProperty('--bg-mid', mid);
  document.body.style.setProperty('--bg-bot', bot);

  scene.background = createBgCanvas(day);
  scene.fog = new THREE.FogExp2(day ? 0xe8e0d8 : 0x120f18, day ? 0.022 : 0.032);

  const barColor = day ? (settings.dayBar || '#e0dcd6') : (settings.nightBar || '#2a2630');
  const barHex = parseInt(barColor.slice(1), 16);
  digitGroups.forEach((col) => {
    if (col.userData.blockMat) {
      col.userData.blockMat.color.setHex(barHex);
      col.userData.blockMat.emissive.setHex(day ? 0x3d3540 : 0x1a1520);
      col.userData.blockMat.emissiveIntensity = day ? 0.22 : 0.35;
    }
  });

  if (day) {
    ambient.color.setHex(0xffeedd);
    ambient.intensity = 0.45;
    key.color.setHex(0xfff5e8);
    key.intensity = 0.85;
    key.position.set(0, 12, 6);
    fill.color.setHex(0xc4b8ff);
    fill.intensity = 0.35;
    rim.color.setHex(0xffe4c4);
    rim.intensity = 0.2;
  } else {
    ambient.color.setHex(0x2a2030);
    ambient.intensity = 0.18;
    key.color.setHex(0xffaa66);
    key.intensity = 0.95;
    key.position.set(0, 18, 2);
    fill.color.setHex(0x664433);
    fill.intensity = 0.12;
    rim.color.setHex(0xff8844);
    rim.intensity = 0.08;
  }
}

// Settings UI
const settingsGear = document.getElementById('settings-gear');
const settingsDropdown = document.getElementById('settings-dropdown');

function syncColorPickers() {
  document.getElementById('day-bg-top').value = settings.dayBgTop || '#f5efe8';
  document.getElementById('day-bg-mid').value = settings.dayBgMid || '#ebe3da';
  document.getElementById('day-bg-bot').value = settings.dayBgBot || '#e8e0d8';
  document.getElementById('day-bar').value = settings.dayBar || '#e0dcd6';
  document.getElementById('night-bg-top').value = settings.nightBgTop || '#1a1625';
  document.getElementById('night-bg-mid').value = settings.nightBgMid || '#0f0d14';
  document.getElementById('night-bg-bot').value = settings.nightBgBot || '#0a0810';
  document.getElementById('night-bar').value = settings.nightBar || '#2a2630';
}

function updateThemeButtons() {
  document.querySelectorAll('.theme-opt').forEach((b) => {
    b.classList.toggle('active', b.dataset.theme === settings.theme);
  });
}

function updateFormatButtons() {
  document.querySelectorAll('.format-opt').forEach((b) => {
    b.classList.toggle('active', (b.dataset.format === '12') === !settings.format24);
  });
}

function applyTextSizes() {
  const mainSize = settings.textSizeMain || 'medium';
  const altSize = settings.textSizeAlt || 'small';
  timeTextEl.className = 'text-size-' + mainSize;
  document.getElementById('info-alt').className = 'text-size-' + altSize + (settings.altTimezone ? '' : ' hidden');
}

function syncSettingsDropdown() {
  syncColorPickers();
  updateThemeButtons();
  updateFormatButtons();
  const altSel = document.getElementById('alt-timezone');
  const mainSel = document.getElementById('text-size-main');
  const altSizeSel = document.getElementById('text-size-alt');
  if (altSel) altSel.value = settings.altTimezone || '';
  if (mainSel) mainSel.value = settings.textSizeMain || 'medium';
  if (altSizeSel) altSizeSel.value = settings.textSizeAlt || 'small';
}

settingsGear.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsDropdown.classList.toggle('open');
  if (settingsDropdown.classList.contains('open')) syncSettingsDropdown();
});

document.addEventListener('click', () => settingsDropdown.classList.remove('open'));
settingsDropdown.addEventListener('click', (e) => e.stopPropagation());

document.querySelectorAll('.theme-opt').forEach((b) => {
  b.addEventListener('click', () => {
    settings.theme = b.dataset.theme;
    isDay = settings.theme === 'day';
    applyTheme(isDay);
    saveSettings(settings);
    updateThemeButtons();
  });
});

document.querySelectorAll('.format-opt').forEach((b) => {
  b.addEventListener('click', () => {
    settings.format24 = b.dataset.format === '24';
    saveSettings(settings);
    buildClock();
    applyTheme(isDay);  // Re-apply bar colors to new columns
    updateTime();
    updateFormatButtons();
  });
});

document.getElementById('reset-theme-btn')?.addEventListener('click', () => {
  settings = { ...DEFAULT_SETTINGS };
  saveSettings(settings);
  isDay = settings.theme === 'day';
  applyTheme(isDay);
  buildClock();
  applyTheme(isDay);
  applyTextSizes();
  updateTime();
  syncSettingsDropdown();
});

['day-bg-top','day-bg-mid','day-bg-bot','day-bar','night-bg-top','night-bg-mid','night-bg-bot','night-bar'].forEach((id) => {
  const el = document.getElementById(id);
  const key = id.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  el.addEventListener('input', () => {
    settings[key] = el.value;
    saveSettings(settings);
    if (key.startsWith('day') && isDay) applyTheme(true);
    if (key.startsWith('night') && !isDay) applyTheme(false);
  });
});

document.getElementById('alt-timezone')?.addEventListener('change', (e) => {
  settings.altTimezone = e.target.value || '';
  saveSettings(settings);
  updateTime();
  applyTextSizes();
});

document.getElementById('text-size-main')?.addEventListener('change', (e) => {
  settings.textSizeMain = e.target.value || 'medium';
  saveSettings(settings);
  applyTextSizes();
});

document.getElementById('text-size-alt')?.addEventListener('change', (e) => {
  settings.textSizeAlt = e.target.value || 'small';
  saveSettings(settings);
  applyTextSizes();
});

// Init from saved settings
isDay = settings.theme === 'day';
applyTheme(isDay);
applyTextSizes();
if (!settings.format24) buildClock();
updateTime();
</script>
